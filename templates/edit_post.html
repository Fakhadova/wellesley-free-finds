

{% block main_content %}
<article class="post-detail">
    <p><a href="{{ url_for('home') }}">&larr; Back to Home</a></p>
    <h1>Edit Post</h1>
    <form method="POST" action="{{ url_for('edit_post', pid=post.pid) }}" enctype="multipart/form-data">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ post.title }}" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required>{{ post.description }}</textarea>

        <label for="categories">Categories (comma-separated):</label>
        <input type="text" id="categories" name="categories" value="{{ post.category | join(', ') }}">

        <label for="photo">Photo (optional):</label>
        {% if post.photo_filename %}
            <img src="{{ url_for('uploaded_photo', filename=post.photo_filename) }}" alt="Current photo" style="max-width: 100%; max-height: 200px;">
            <p>Current photo: {{ post.photo_filename }}</p>
        {% endif %}
        <input type="file" id="photo" name="photo">

        <button type="submit">Update Post</button>
    </form>
    </article>
{% endblock %}
