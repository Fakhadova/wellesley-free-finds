<!-- Edit an existing Request post, including its details.-->
{%extends "base.html" %}

{% block main_content %}
<article class="post-detail">
    <p>
        <a href = "{{url_for('post_detail', pid = post.pid)}}">
            Back to Post </a>
    </p>

    <h1>Edit Post</h1>
    <form method="POST" action="{{ url_for('edit_post', pid=post.pid) }}" 
    enctype="multipart/form-data">

        <label for="title">Item Name:</label>
        <input type="text" id="title" name="title" value="{{form.get('title', post.title)}}" 
        maxlength = "100" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" maxlength = "500" 
        required> {{ form.get('description', post.description) }}</textarea>

        <fieldset>
            <legend> Categories:</legend>
            {% for value, label in categories.items() %}
            <label>
                <input type = "checkbox"
                name = "category"
                value = "{{value}}"
                {% if value in chosen %} checked {%endif%}>
            {{label}} </label>
        {%endfor%}
    </fieldset>

    <label>Current Photo </label>
    {% if post.photo_filename %}
    <p>
        <img src = "{{url_for('uploaded_photo', filename = post.photo_filename)}}"
        alt = "Current photo"
        style = "max-width: 100%; max-height: 200px;">
    </p>
    {%else%}
    <p> No photo uploaded.</p>
    {%endif%}

    <label for="photo">Replace Photo (optional):</label>
        <input type="file"
               id="photo"
               name="photo"
               accept="image/jpeg,image/png,image/gif,image/webp">

        <p>Leave this blank to keep your current photo.</p>

        <button type="submit">Save Changes</button>

        <a href="{{ url_for('post_detail', pid=post.pid) }}">
            Cancel
        </a>

    </form>
</article>
{% endblock %}
